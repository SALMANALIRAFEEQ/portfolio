<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Generated by blog/_system/build.py from blog/_src/posts/*.md. Edit the Markdown files or the template, not this page. -->
  <!-- Page transition: start covered when arriving from another page (or via back/forward), then script.js reveals -->
  <script>try{var n=performance.getEntriesByType('navigation')[0];if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&(sessionStorage.getItem('pt')||(n&&n.type==='back_forward')))document.documentElement.classList.add('pt-enter')}catch(e){}</script>
  <title>Blog | Salman Ali Rafeeq, Web Developer in Lahore</title>
  <meta name="description" content="Practical articles on WordPress, Shopify, e-commerce, SEO and automation for small businesses, by web developer Salman Ali Rafeeq.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{blog_url}}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site_name}}">
  <meta property="og:title" content="Blog | Salman Ali Rafeeq">
  <meta property="og:description" content="Practical articles on WordPress, Shopify, e-commerce, SEO and automation for small businesses.">
  <meta property="og:url" content="{{blog_url}}">
  <meta property="og:image" content="{{image}}">
  <meta name="twitter:card" content="summary">

  <script type="application/ld+json">
{{jsonld_blog}}
  </script>
  <script type="application/ld+json">
{{jsonld_crumbs}}
  </script>

  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="assets/blog.css">
</head>
<body class="blog-page">
  <div class="pt" aria-hidden="true"><i class="pt__a"></i><i class="pt__b"></i><span class="pt__mark">SAR<i></i></span></div>
  <a class="skip" href="#main">Skip to content</a>

{{nav}}

  <main id="main">
    <header class="blog-head wrap">
      <nav class="crumbs" aria-label="Breadcrumb">
        <ol><li><a href="../">Home</a></li><li aria-current="page">Blog</li></ol>
      </nav>
      <p class="eyebrow">Blog</p>
      <h1>Notes on web, <span class="outline">e-commerce &amp; automation</span></h1>
      <p>Practical, plain-English articles for small businesses: choosing platforms, getting found on Google, and saving time with automation.</p>
    </header>

    <!-- Post grid: newest first; 3 per row on desktop, 2 on tablet, 1 on phone -->
    <section class="wrap" aria-label="Articles">
      <ol class="post-grid">
{{cards_html}}
      </ol>
    </section>
  </main>

{{footer}}

  <script src="../script.js"></script>
</body>
</html>
